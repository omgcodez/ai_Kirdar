<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ORION AI Chat</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
}

/* ÜST BAR */
header {
    height: 70px;
    width: 100%;
    background: #000;
    border-bottom: 1px solid #eeff00;
    display: flex;
    align-items: center;
    padding: 0 30px;
}

header h1 {
    margin: 0;
    color: #eeff00;
    font-size: 25px;
    font-weight: 600;
}

/* ANA CHAT */
#chat-container {
    height: calc(100vh - 70px);
    width: 100%;
    display: flex;
    flex-direction: column;
    background: #000;
}

/* MESAJ ALANI */
#chat {
    flex: 1;
    width: 100%;
    overflow-y: auto;
    padding: 30px 8%;
    scroll-behavior: smooth;
}

/* Scrollbar */
#chat::-webkit-scrollbar {
    width: 8px;
}

#chat::-webkit-scrollbar-track {
    background: #000;
}

#chat::-webkit-scrollbar-thumb {
    background: #eeff00;
    border-radius: 10px;
}

/* KULLANICI MESAJI */
p.user {
    max-width: 750px;
    margin: 15px 0 15px auto;
    background: #eeff00;
    color: #000;
    padding: 13px 18px;
    border-radius: 15px 15px 3px 15px;
    text-align: left;
    line-height: 1.5;
}

/* AI MESAJI */
p.bot {
    max-width: 750px;
    margin: 15px auto 15px 0;
    background: #151515;
    color: white;
    border: 1px solid #eeff00;
    padding: 13px 18px;
    border-radius: 15px 15px 15px 3px;
    text-align: left;
    line-height: 1.5;
}

/* ALT MESAJ KUTUSU */
#input-area {
    width: 100%;
    padding: 18px 8%;
    background: #000;
    border-top: 1px solid #222;
    display: flex;
    gap: 10px;
}

/* INPUT */
#question {
    flex: 1;
    height: 52px;
    padding: 0 18px;
    font-size: 16px;
    color: white;
    background: #111;
    border: 1px solid #eeff00;
    border-radius: 12px;
    outline: none;
}

#question:focus {
    box-shadow: 0 0 10px rgba(238, 255, 0, 0.25);
}

#question::placeholder {
    color: #888;
}

/* GÖNDER BUTONU */
button {
    width: 120px;
    height: 52px;
    border: none;
    border-radius: 12px;
    background: #eeff00;
    color: #000;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #ffff66;
}

button:active {
    transform: scale(0.97);
}

/* TELEFON */
@media (max-width: 700px) {

    header {
        height: 60px;
        padding: 0 15px;
    }

    header h1 {
        font-size: 18px;
    }

    #chat-container {
        height: calc(100vh - 60px);
    }

    #chat {
        padding: 20px 15px;
    }

    #input-area {
        padding: 12px 15px;
    }

    button {
        width: 90px;
    }

    p.user,
    p.bot {
        max-width: 90%;
    }
}
</style>

</head>

<body>

<header>
    <h1>ORION AI <span style="color:white;">—</span> <span style="font-size:15px;">by CloseAI</span></h1>
</header>

<div id="chat-container">

```
<div id="chat"></div>

<div id="input-area">
    <input
        id="question"
        placeholder="Sorunu sor..."
        autocomplete="off"
    >

    <button onclick="ask()">Gönder</button>
</div>
```

</div>

<script>

async function ask(){

    let q = document.getElementById("question").value;

    if(!q) return;

    let chat = document.getElementById("chat");

    chat.innerHTML += `
        <p class="user">
            <b>Siz:</b> ${q}
        </p>
    `;

    chat.scrollTop = chat.scrollHeight;

    try {

        let res = await fetch("http://127.0.0.1:5000/ask", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body: JSON.stringify({
                question:q
            })
        });

        let data = await res.json();

        chat.innerHTML += `
            <p class="bot">
                <b>ORION AI:</b> ${data.answer}
            </p>
        `;

    } catch(error) {

        chat.innerHTML += `
            <p class="bot">
                <b>ORION AI:</b> Sunucuya bağlanılamadı.
            </p>
        `;

    }

    chat.scrollTop = chat.scrollHeight;

    document.getElementById("question").value = "";

    document.getElementById("question").focus();
}


/* ENTER İLE GÖNDER */
document.getElementById("question").addEventListener("keydown", function(event){

    if(event.key === "Enter"){
        ask();
    }

});

</script>

</body>
</html>
