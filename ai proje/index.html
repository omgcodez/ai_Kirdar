<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Kırdar GPT Chat</title>
<style>
body { font-family: Arial, sans-serif; background: #f5f5f5; margin:0; padding:0; }
header { background:#1a1a1a; padding:10px 20px; display:flex; align-items:center; height:70px; box-shadow:0 2px 5px rgba(0,0,0,0.3);}
header img { height:50px; margin-right:15px; border-radius:8px;}
header h1 { color:white; margin:0; font-size:24px;}

#chat-container { max-width:600px; margin:30px auto; background:white; padding:20px; border-radius:15px; box-shadow:0 2px 8px rgba(0,0,0,0.2);}
#chat { height:400px; overflow-y:auto; border:1px solid #ccc; padding:10px; border-radius:15px; background:#fefefe; display:flex; flex-direction:column; }
p.user { background:#d1e7dd; padding:10px; border-radius:15px 15px 0 15px; margin:8px 0; text-align:right; max-width:80%; align-self:flex-end;}
p.bot { background:#f8d7da; padding:10px; border-radius:15px 15px 15px 0; margin:8px 0; text-align:left; max-width:80%; align-self:flex-start;}

#input-container { display:flex; margin-top:15px;}
#question { flex:1; padding:12px; font-size:16px; border-radius:15px; border:1px solid #ccc; outline:none;}
button { padding:12px 20px; font-size:16px; margin-left:10px; border-radius:15px; border:none; background-color:#1a1a1a; color:white; cursor:pointer;}
button:hover { background-color:#333;}

</style>
</head>
<body>

<header>
    <img src="https://www.kirdarbilgioen.k12.tr/wp-content/uploads/2020/03/logo.png" 
         onerror="this.onerror=null; this.src='logo.png';" 
         alt="Kırdar GPT Logo">
    <h1>Kırdar GPT</h1>
</header>

<div id="chat-container">
    <div id="chat"></div>
    <div id="input-container">
        <input id="question" placeholder="Sorunu yaz...">
        <button onclick="ask()">Gönder</button>
    </div>
</div>

<script>
async function ask(){
    let q = document.getElementById("question").value;
    if(!q) return;
    let chat = document.getElementById("chat");

    chat.innerHTML += `<p class="user"><b>Sen:</b> ${q}</p>`;
    document.getElementById("question").value = "";

    // Backend çağır
    try {
        const res = await fetch('http://127.0.0.1:5000/ask', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({question:q})
        });
        const data = await res.json();
        chat.innerHTML += `<p class="bot"><b>Bot:</b> ${data.answer}</p>`;
    } catch {
        chat.innerHTML += `<p class="bot"><b>Bot:</b> Backend çalışmıyor, demo cevap.</p>`;
    }

    chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
